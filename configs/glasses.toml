# Optical glass catalog for OpticalCalculator.
#
# nd/vd/pgf figures are drawn from publicly available Schott AG, Ohara
# Corporation, and Hoya Corporation optical glass datasheets (standard
# reference data, not proprietary). FPL53, FPL51, and FK61 are the key
# ED (extra-low-dispersion) glasses used by triplet/quintuplet apo designs
# per architecture.md section 2a (`quintuplet`'s `glasses` list) and
# section 3 (secondary-spectrum correction, row 3 of the chromatic solver).
#
# Schema (architecture.md section 2b): one [glasses.<NAME>] table per glass,
# keyed by the glass name used in designs.toml's `glasses = [...]` lists.
# The table does NOT repeat `name` as a field -- config.rs's loader
# (Chunk 5, not yet built) reads the TOML key as `Glass.name` when
# constructing the `Vec<Glass>` / `GlassCatalog`. Coordinated wrapper shape
# for Chunk 5 (documented in the Chunk 4 build report):
#
#   #[derive(serde::Deserialize)]
#   struct GlassEntry { nd: f64, vd: f64, pgf: f64 }
#   #[derive(serde::Deserialize)]
#   struct GlassesFile { glasses: std::collections::HashMap<String, GlassEntry> }
#
#   // then: glasses.into_iter().map(|(name, e)| Glass { name, nd: e.nd,
#   //       vd: e.vd, pgf: e.pgf }).collect::<Vec<Glass>>()
#
# pgf (P_g,F, partial dispersion) sourcing: each entry below notes whether
# the value is an exact catalog datasheet figure or the normal-line
# approximation P_g,F ~= 0.6438 - 0.001682 x Vd (used where an exact
# datasheet figure was not confidently available -- these are flagged
# "normal-line approx"). Sanity range per formula-validation.md finding F6:
# 0.50 < pgf < 0.63, 20 < vd < 100 -- every entry below satisfies this.

# --- Standard crown/flint achromat pair -----------------------------------

[glasses.BK7]  # Schott N-BK7 -- exact datasheet value
nd = 1.51680
vd = 64.17
pgf = 0.5349

[glasses.F2]  # Schott N-F2 -- normal-line approximation (Schott published exact value is very close)
nd = 1.62004
vd = 36.37
pgf = 0.5828

