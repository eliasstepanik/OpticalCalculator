# Example user request: F8 Ritchey-Chretien, 200mm (8") aperture, f/3
# primary -> system focal length 200.0 * 8.0 = 1600mm; secondary
# magnification m = f_ratio / primary_f_ratio = 8/3. Required fields per
# configs/designs.toml's [designs.rc].required: aperture_mm, f_ratio,
# primary_f_ratio, backfocus_mm.

design = "rc"
aperture_mm = 200.0
f_ratio = 8.0

# primary_f_ratio: the PRIMARY MIRROR's own focal ratio (f1/D), distinct
# from the system f_ratio above. f/3 is a common RC primary choice.
primary_f_ratio = 3.0

# backfocus_mm: measured from the PRIMARY MIRROR VERTEX to the focal plane
# (Schroeder section 6.2 convention b), NOT from the secondary or the tube's
# rear cell. 150mm is a realistic RC backfocus (matches the worked example
# in src/designs/cassegrain.rs).
backfocus_mm = 150.0

# Optional fields below -- included to demonstrate the FOV output section.
sensor_diag_mm = 28.4          # full-frame sensor diagonal (36x24mm), mm
eyepiece_fieldstop_mm = 27.0   # e.g. a 2" 30mm eyepiece's field-stop diameter
wavelength_nm = 550.0          # visual green (this is also the ATM default)

# v2 (--fabrication, Chunk V9) -- only consulted when --fabrication is
# passed AND the design's fab_applicable list includes the matching
# subsystem (configs/designs.toml's [designs.rc]: substrate, tolerance,
# baffle, support, throughput). Ignored entirely on a v1 (no
# --fabrication) run.
substrate = "pyrex"            # classic low-cost ATM mirror blank
coating = "enhanced_aluminum"  # standard commercial telescope mirror coating

# field_diam_mm: fully-illuminated field diameter, mm -- feeds the v2
# baffle subsystem (#3, [[v2-baffle-vignetting]]); reused here as 2h
# (B1's pinned h-convention) rather than a new field_of_view_deg input.
# 20mm matches the A2 RC worked example in formula-validation-v2.md.
# support_scheme/support_n_points (#6) are left unset -- fully optional
# with sensible defaults ("9_point"/9) applied by fabrication::compute
# when absent, so this example needed no new required fields for V-8.
field_diam_mm = 20.0
